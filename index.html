<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trips Price Calculator</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  <style>
    body { font: 16px system-ui; margin: 20px; }
    label { display: block; margin-bottom: 12px; }
    input { display: block; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <form id="calculator" hidden>
    <p>Select one text box on the board, then enter the price here.</p>
    <label>Total price ($)
      <input name="total" type="number" min="0" step="0.01" required>
    </label>
    <label>People
      <input name="people" type="number" min="1" value="2" required>
    </label>
    <label>Nights
      <input name="nights" type="number" min="1" value="2" required>
    </label>
    <button type="submit">Update price box</button>
    <p id="status" role="status"></p>
  </form>

  <script>
    const form = document.querySelector('#calculator');

    if (new URLSearchParams(location.search).has('panel')) {
      form.hidden = false;
      form.addEventListener('submit', updatePriceBox);
    } else {
      miro.board.ui.on('icon:click', async () => {
        await miro.board.ui.openPanel({ url: 'index.html?panel=1' });
      });
    }

    async function updatePriceBox(event) {
      event.preventDefault();
      const status = document.querySelector('#status');

      try {
        const selected = await miro.board.getSelection();
        if (selected.length !== 1 || selected[0].type !== 'text') {
          status.textContent = 'Select one Miro text box and try again.';
          return;
        }

        const fields = new FormData(form);
        const total = Number(fields.get('total'));
        const people = Number(fields.get('people'));
        const nights = Number(fields.get('nights'));
        const dollars = new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD'
        });

        const box = selected[0];
        box.content = [
          `<p>Price TOT: ${dollars.format(total)}</p>`,
          `<p>Price / person: ${dollars.format(total / people)}</p>`,
          `<p>Price / person / night: ${dollars.format(total / (people * nights))}</p>`
        ].join('');
        await box.sync();

        status.textContent = 'Price box updated.';
      } catch (error) {
        status.textContent = `Could not update the price box: ${error.message}`;
      }
    }
  </script>
</body>
</html>
